# fly.toml app configuration file generated for loan-default-project on 2026-11-09T01:39:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'loan-default-project'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
